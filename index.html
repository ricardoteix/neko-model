<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chen ER - Conceptual Diagram Playground</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./assets/index-_PWCzD9W.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-Cw9jJOLg.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-section">
        <span class="glowing-orb"></span>
        <h1>Chen ER <span class="badge">Playground</span></h1>
      </div>
      <div class="controls-section">
        <div class="select-wrapper">
          <label for="theme-select">Theme:</label>
          <select id="theme-select">
            <option value="default">Default (Light)</option>
            <option value="dark" selected>Dark Mode</option>
            <option value="forest">Forest Green</option>
            <option value="neutral">Neutral (B&W)</option>
          </select>
        </div>
        <div class="select-wrapper">
          <label for="spacing-select">Attribute Spacing:</label>
          <select id="spacing-select">
            <option value="default" selected>Default (Dynamic)</option>
            <option value="zigzag">Zigzag Alternating</option>
            <option value="classic">Classic (Legacy)</option>
          </select>
        </div>
        <button id="btn-copy" class="btn" title="Copy Diagram Code">
          Copy Code
        </button>
        <button id="btn-export-svg" class="btn btn-primary" title="Export as SVG File">
          Export SVG
        </button>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="workspace">
      <!-- Toolbox Panel -->
      <section class="panel toolbox-panel">
        <div class="panel-header" style="padding: 12px 10px; justify-content: center;">
          <h2 style="font-size: 11px;">Tools</h2>
        </div>
        <div class="toolbox-items">
          <button class="tool-btn active" data-tool="select" title="Selection Tool (Esc)">
            <span class="tool-icon">↖</span>
            <span class="tool-label">Select</span>
          </button>
          <div class="tool-divider"></div>
          <button class="tool-btn" data-tool="entity" title="Add Entity">
            <span class="tool-icon">⬡</span>
            <span class="tool-label">Entity</span>
          </button>
          <button class="tool-btn" data-tool="relationship" title="Add Relationship">
            <span class="tool-icon">♢</span>
            <span class="tool-label">Rel</span>
          </button>
          <button class="tool-btn" data-tool="specialization" title="Add Specialization">
            <span class="tool-icon">◯</span>
            <span class="tool-label">Spec</span>
          </button>
          <button class="tool-btn" data-tool="attribute" title="Add Attribute">
            <span class="tool-icon">⚬</span>
            <span class="tool-label">Attr</span>
          </button>
        </div>
      </section>

      <!-- Left Panel: Code Editor -->
      <section class="panel editor-panel" id="editor-panel">
        <div class="panel-header">
          <h2>DSL Source</h2>
          <span class="file-name">diagram.chen</span>
        </div>
        <div class="editor-wrapper">
          <textarea id="dsl-editor" spellcheck="false" autocomplete="off">chenER
theme dark
layout default

entity Customer {
  id key
  name
  phones multivalued [offset: 0, 15]
  address composite(street, city, zip)
}

weak_entity Order {
  order_no weak_key
  order_date
}

relationship Places {
  purchase_date
}

identifying_relationship Has

entity Item {
  item_code key
  price
}

Customer -- Places : "1"
Places == Order : "N"

Order == Has : "1"
Has == Item : "M"

specialization EmployeeType {
  type: disjoint
  participation: total
  superclass: Employee
  subclasses: Manager, Technician
}

entity Employee {
  ssn key
}
entity Manager
entity Technician</textarea>
        </div>
      </section>

      <!-- Center Panel: SVG Visualizer -->
      <section class="panel visualizer-panel">
        <div class="panel-header">
          <h2>Live Preview</h2>
          <div class="canvas-actions" style="display: flex; gap: 8px; align-items: center;">
            <button id="btn-undo" class="btn btn-sm" title="Undo (Ctrl+Z)" disabled>↶</button>
            <button id="btn-redo" class="btn btn-sm" title="Redo (Ctrl+Y)" disabled>↷</button>
            <div style="width: 1px; height: 16px; background: var(--border-color);"></div>
            <button id="btn-zoom-out" class="btn btn-sm" title="Zoom Out">-</button>
            <button id="btn-zoom-in" class="btn btn-sm" title="Zoom In">+</button>
            <button id="btn-zoom-reset" class="btn btn-sm">Reset</button>
            <div style="width: 1px; height: 16px; background: var(--border-color);"></div>
            <label class="inspector-checkbox" style="margin: 0; font-size: 11px; color: var(--color-muted); display: flex; align-items: center; gap: 4px; user-select: none;">
              <input type="checkbox" id="chk-snap" checked /> Snap
            </label>
            <div style="width: 1px; height: 16px; background: var(--border-color);"></div>
            <button id="btn-toggle-editor" class="btn btn-sm" style="background: rgba(6,182,212,0.1); border-color: rgba(6,182,212,0.3); color: var(--primary);">Toggle Code</button>
          </div>
        </div>
        <div class="canvas-container" style="cursor: grab;">
          <div class="grid-background"></div>
          <div id="canvas-preview" class="canvas-preview" style="width: 100%; height: 100%; display: block; overflow: hidden; position: relative; padding: 0;"></div>
        </div>
      </section>

      <!-- Right Panel: Properties Inspector -->
      <section class="panel inspector-panel">
        <div class="panel-header">
          <h2>Properties</h2>
        </div>
        <div id="inspector-content" class="inspector-content">
          <p class="empty-state">Select a node or connection line to inspect properties</p>
        </div>
      </section>
    </main>

    <!-- Error Overlay Footer -->
    <footer id="error-footer" class="error-footer hidden">
      <button id="btn-close-error" class="btn btn-sm" style="position: absolute; top: 12px; right: 24px; color: var(--color-muted); background: transparent; border: none; font-size: 16px; cursor: pointer;" title="Close">✕</button>
      <div class="error-content">
        <span class="error-icon">⚠️</span>
        <div class="error-message-wrapper">
          <h3>Compilation Error</h3>
          <p id="error-message">Syntax error on line 12, column 5</p>
        </div>
      </div>
    </footer>
  </div>

</body>
</html>
