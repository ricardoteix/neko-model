<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chen ER - Conceptual Diagram Playground</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-section">
        <span class="glowing-orb"></span>
        <h1>Chen ER <span class="badge">Playground</span></h1>
      </div>
      <div class="controls-section">
        <div class="select-wrapper">
          <label for="theme-select">Theme:</label>
          <select id="theme-select">
            <option value="default">Default (Light)</option>
            <option value="dark" selected>Dark Mode</option>
            <option value="forest">Forest Green</option>
            <option value="neutral">Neutral (B&W)</option>
          </select>
        </div>
        <button id="btn-copy" class="btn" title="Copy Diagram Code">
          Copy Code
        </button>
        <button id="btn-export-svg" class="btn btn-primary" title="Export as SVG File">
          Export SVG
        </button>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="workspace">
      <!-- Left Panel: Code Editor -->
      <section class="panel editor-panel">
        <div class="panel-header">
          <h2>DSL Source</h2>
          <span class="file-name">diagram.chen</span>
        </div>
        <div class="editor-wrapper">
          <textarea id="dsl-editor" spellcheck="false" autocomplete="off">chenER
theme dark
layout default

entity Customer {
  id key
  name
  phones multivalued [offset: 0, 15]
  address composite(street, city, zip)
}

weak_entity Order {
  order_no weak_key
  order_date
}

relationship Places {
  purchase_date
}

identifying_relationship Has

entity Item {
  item_code key
  price
}

Customer -- Places : "1"
Places == Order : "N"

Order == Has : "1"
Has == Item : "M"

specialization EmployeeType {
  type: disjoint
  participation: total
  superclass: Employee
  subclasses: Manager, Technician
}

entity Employee {
  ssn key
}
entity Manager
entity Technician</textarea>
        </div>
      </section>

      <!-- Right Panel: SVG Visualizer -->
      <section class="panel visualizer-panel">
        <div class="panel-header">
          <h2>Live Preview</h2>
          <div class="canvas-actions">
            <button id="btn-zoom-reset" class="btn btn-sm">Reset View</button>
          </div>
        </div>
        <div class="canvas-container">
          <div class="grid-background"></div>
          <div id="canvas-preview" class="canvas-preview"></div>
        </div>
      </section>
    </main>

    <!-- Error Overlay Footer -->
    <footer id="error-footer" class="error-footer hidden">
      <div class="error-content">
        <span class="error-icon">⚠️</span>
        <div class="error-message-wrapper">
          <h3>Compilation Error</h3>
          <p id="error-message">Syntax error on line 12, column 5</p>
        </div>
      </div>
    </footer>
  </div>

  <script type="module" src="./app.ts"></script>
</body>
</html>
