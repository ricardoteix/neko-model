<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neko Model - Conceptual Database Modeling</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-section">
        <img src="./assets/neko-model-icon.png" alt="Neko Model Logo" class="brand-icon" />
        <h1>Neko Model <span class="badge">Playground</span></h1>
      </div>
      <div class="controls-section">
        <div class="select-wrapper">
          <label for="lang-select" id="lbl-lang-select">Idioma:</label>
          <select id="lang-select">
            <option value="pt-br" selected>Português</option>
            <option value="en">English</option>
          </select>
        </div>
        <div class="select-wrapper">
          <label for="theme-select" id="lbl-theme-select">Tema:</label>
          <select id="theme-select">
            <option value="default" id="opt-theme-default" selected>Padrão (Claro)</option>
            <option value="dark" id="opt-theme-dark">Modo Escuro</option>
            <option value="forest" id="opt-theme-forest">Verde Floresta</option>
            <option value="neutral" id="opt-theme-neutral">Neutro (P&B)</option>
          </select>
        </div>
        <div class="select-wrapper">
          <label for="spacing-select" id="lbl-spacing-select">Espaçamento de Atributos:</label>
          <select id="spacing-select">
            <option value="manual" id="opt-spacing-manual" selected>Manual (Padrão)</option>
            <option value="default" id="opt-spacing-default">Dinâmico</option>
            <option value="zigzag" id="opt-spacing-zigzag">Zigue-zague Alternado</option>
            <option value="classic" id="opt-spacing-classic">Clássico (Legado)</option>
          </select>
        </div>
        <button id="btn-copy" class="btn" title="Copiar Código">
          Copiar Código
        </button>
        <button id="btn-open-nkm" class="btn" title="Abrir arquivo .nkm">
          Abrir .nkm
        </button>
        <input type="file" id="input-open-nkm" accept=".nkm,.txt" style="display: none;" />
        <button id="btn-export-nkm" class="btn" title="Exportar .nkm">
          Exportar .nkm
        </button>
        <div class="dropdown-wrapper" id="dropdown-export-wrapper">
          <button id="btn-export-img" class="btn btn-primary" title="Exportar Imagem">
            <span id="lbl-export-img">Exportar Imagem</span>
            <span class="dropdown-arrow" style="font-size: 10px; margin-left: 2px;">▾</span>
          </button>
          <div id="export-dropdown-menu" class="dropdown-menu hidden">
            <button id="btn-export-svg" class="dropdown-item">
              <span id="lbl-export-svg">Exportar SVG</span>
            </button>
            <button id="btn-export-png" class="dropdown-item">
              <span id="lbl-export-png">Exportar PNG</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="workspace">
      <!-- Toolbox Panel -->
      <section class="panel toolbox-panel">
        <div class="panel-header">
          <h2 id="toolbox-title">Ferramentas</h2>
        </div>
        <div class="toolbox-items">
          <button class="tool-btn active" id="tool-btn-select" data-tool="select" title="Ferramenta de Seleção (Esc)">
            <span class="tool-icon">↖</span>
            <span class="tool-label" id="tool-lbl-select">Selecionar</span>
          </button>
          <button class="tool-btn" id="tool-btn-pan" data-tool="pan" title="Mover Canvas / Pan (H)">
            <span class="tool-icon">✋</span>
            <span class="tool-label" id="tool-lbl-pan">Mover</span>
          </button>
          <div class="tool-divider"></div>
          <button class="tool-btn" id="tool-btn-entity" data-tool="entity" title="Adicionar Entidade">
            <span class="tool-icon">⬡</span>
            <span class="tool-label" id="tool-lbl-entity">Entidade</span>
          </button>
          <button class="tool-btn" id="tool-btn-relationship" data-tool="relationship" title="Adicionar Relacionamento">
            <span class="tool-icon">♢</span>
            <span class="tool-label" id="tool-lbl-relationship">Relac.</span>
          </button>
          <button class="tool-btn" id="tool-btn-specialization" data-tool="specialization" title="Adicionar Especialização">
            <span class="tool-icon">◯</span>
            <span class="tool-label" id="tool-lbl-specialization">Espec.</span>
          </button>
          <button class="tool-btn" id="tool-btn-attribute" data-tool="attribute" title="Adicionar Atributo">
            <span class="tool-icon">⚬</span>
            <span class="tool-label" id="tool-lbl-attribute">Atributo</span>
          </button>
        </div>
      </section>

      <!-- Left Panel: Code Editor -->
      <section class="panel editor-panel" id="editor-panel">
        <div class="panel-header">
          <h2 id="editor-title">Código DSL</h2>
          <span class="file-name" id="editor-file-name">diagrama.nkm</span>
        </div>
        <div class="editor-wrapper">
          <div id="dsl-editor" class="dsl-editor-container"></div>
        </div>
      </section>

      <!-- Draggable Splitter Handle -->
      <div id="workspace-splitter" class="workspace-splitter"></div>

      <!-- Center Panel: SVG Visualizer -->
      <section class="panel visualizer-panel">
        <div class="panel-header">
          <h2 id="visualizer-title">Visualização</h2>
          <div class="canvas-actions" style="display: flex; gap: 8px; align-items: center;">
            <button id="btn-undo" class="btn btn-sm" title="Desfazer (Ctrl+Z)" disabled>↶</button>
            <button id="btn-redo" class="btn btn-sm" title="Refazer (Ctrl+Y)" disabled>↷</button>
            <div style="width: 1px; height: 16px; background: var(--border-color);"></div>
            <button id="btn-zoom-out" class="btn btn-sm" title="Diminuir Zoom">-</button>
            <button id="btn-zoom-in" class="btn btn-sm" title="Aumentar Zoom">+</button>
            <button id="btn-zoom-reset" class="btn btn-sm">Resetar</button>
            <div style="width: 1px; height: 16px; background: var(--border-color);"></div>
            <button id="btn-align-h" class="btn btn-sm" title="Alinhar Horizontalmente" style="font-size: 10px; padding: 2px 6px;">Alinhar H</button>
            <button id="btn-align-v" class="btn btn-sm" title="Alinhar Verticalmente" style="font-size: 10px; padding: 2px 6px;">Alinhar V</button>
            <div style="width: 1px; height: 16px; background: var(--border-color);"></div>
            <label class="inspector-checkbox" style="margin: 0; font-size: 11px; color: var(--color-muted); display: flex; align-items: center; gap: 4px; user-select: none;">
              <input type="checkbox" id="chk-snap" checked /> <span id="lbl-snap">Grade</span>
            </label>
            <div class="select-wrapper" style="margin: 0 4px; font-size: 11px;">
              <select id="select-snap-size" style="padding: 2px 6px; font-size: 11px; height: auto;">
                <option value="5">5px</option>
                <option value="10">10px</option>
                <option value="20" selected>20px</option>
                <option value="40">40px</option>
              </select>
            </div>
            <div style="width: 1px; height: 16px; background: var(--border-color);"></div>
            <button id="btn-toggle-editor" class="btn btn-sm" style="background: rgba(6,182,212,0.1); border-color: rgba(6,182,212,0.3); color: var(--primary);">Código</button>
          </div>
        </div>
        <div class="canvas-container" style="cursor: grab;">
          <div class="grid-background"></div>
          <div id="canvas-preview" class="canvas-preview" style="width: 100%; height: 100%; display: block; overflow: hidden; position: relative; padding: 0;"></div>
        </div>
      </section>

      <!-- Right Panel: Properties Inspector -->
      <section class="panel inspector-panel">
        <div class="panel-header">
          <h2 id="inspector-title">Propriedades</h2>
        </div>
        <div id="inspector-content" class="inspector-content">
          <p class="empty-state" id="inspector-empty-state">Selecione um elemento ou linha para editar suas propriedades</p>
        </div>
      </section>
    </main>

    <!-- Error Overlay Footer -->
    <footer id="error-footer" class="error-footer hidden">
      <button id="btn-close-error" class="btn btn-sm" style="position: absolute; top: 12px; right: 24px; color: var(--color-muted); background: transparent; border: none; font-size: 16px; cursor: pointer;" title="Close">✕</button>
      <div class="error-content">
        <span class="error-icon">⚠️</span>
        <div class="error-message-wrapper">
          <h3>Compilation Error</h3>
          <p id="error-message">Syntax error on line 12, column 5</p>
        </div>
      </div>
    </footer>
  </div>

  <script type="module" src="./app.ts"></script>
</body>
</html>
